receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  genainormalizer:
    semconv_version: "1.39.0"
    profiles:
      - openinference
      - openllmetry
      - langchain
      - langsmith
      - crewai
      - pydanticai
      - strands
      - autogen
    remove_originals: false

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [genainormalizer]
      exporters: [debug]
